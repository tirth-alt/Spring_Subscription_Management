server:
  port: 8080

spring:
  application:
    name: subscription-platform

  # profiles:
  #   active: dev

  data:
    mongodb:
      uri: ${MONGODB_URI}

  jackson:
    serialization:
      indent_output: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: caffeine
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:placeholder@gmail.com}
    password: ${MAIL_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.data.mongodb: INFO
    org.mongodb.driver: DEBUG

security:
  jwt:
    # Secret must be at least 256 bits (32 characters). For production, use env variable.
    secret: ${JWT_SECRET:ThisIsASecureJwtSecretKeyForDevelopment2024SubscriptionPlatform}
    expiration: 3600000  # 1 hour in milliseconds

# Razorpay Configuration (Test Mode)
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}
